name: gbrain-retrieval-reflex
version: 0.6.0
description: >-
  Ambient GBrain push-context: HTTP MCP volunteer_context (entity, multi-turn)
  + hybrid query fallback, merge/dedupe, inject top-N strength-ordered Brain
  pages with short previews into pre_llm_call. Optional resolve IPC if a sock
  exists (stdio serve only). Silent no-op when GBrain is unreachable or no
  bearer token is available. Endpoints, pointers, timeouts, token and state
  paths are all env-overridable (GBRAIN_HOME, GBRAIN_MCP_URL, ...).
author: aean0x
kind: standalone
provides_hooks:
  - pre_llm_call
